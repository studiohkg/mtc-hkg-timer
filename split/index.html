<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Split</title>
<style>
  :root {
    --bg: #f5f5f4; --card: #fff; --ink: #1c1917; --muted: #78716c; --line: #e7e5e4;
    --brand: #0f766e; --brand-ink: #fff; --pos: #15803d; --neg: #c2410c; --danger: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0a09; --card: #1c1917; --ink: #f5f5f4; --muted: #a8a29e; --line: #292524;
            --brand: #14b8a6; --brand-ink: #042f2e; --pos: #4ade80; --neg: #fb923c; --danger: #f87171; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom)); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  h1 { font-size: 22px; margin: 0; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; padding: 12px 16px;
    background: var(--line); color: var(--ink); }
  button.primary { background: var(--brand); color: var(--brand-ink); font-weight: 600; }
  button.ghost { background: transparent; color: var(--muted); padding: 8px; }
  button.danger { background: transparent; color: var(--danger); }
  button:disabled { opacity: .5; }
  .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .balance { text-align: center; padding: 24px 16px; }
  .balance .who { color: var(--muted); }
  .balance .amt { font-size: 36px; font-weight: 700; margin: 4px 0 16px; font-variant-numeric: tabular-nums; }
  .month { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; margin: 20px 4px 6px; }
  .entry { display: flex; gap: 12px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .entry:last-child { border-bottom: 0; }
  .entry .date { width: 36px; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.1; }
  .entry .date b { display: block; font-size: 18px; color: var(--ink); }
  .entry .main { flex: 1; min-width: 0; }
  .entry .desc { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry .sub { color: var(--muted); font-size: 13px; }
  .entry .eff { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }
  .entry .eff b { display: block; font-size: 15px; }
  .pos { color: var(--pos); } .neg { color: var(--neg); } .muted { color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 32px 8px; }
  .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom));
    box-shadow: 0 6px 20px rgba(0,0,0,.2); padding: 16px 28px; border-radius: 999px; }
  /* Sheet */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .overlay.open { display: flex; }
  .sheet { background: var(--card); width: 100%; max-width: 560px; max-height: 92vh; overflow: auto;
    border-radius: 20px 20px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); }
  .sheet h2 { margin: 0 0 16px; font-size: 20px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input { font: inherit; width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); }
  input.big { font-size: 28px; font-weight: 700; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { flex: 1 1 0; padding: 10px 8px; font-size: 14px; white-space: nowrap; }
  .seg button.on { background: var(--brand); color: var(--brand-ink); font-weight: 600; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 18px; }
  .hint.err { color: var(--danger); }
  .actions { display: flex; gap: 8px; margin-top: 20px; }
  .actions .primary { flex: 1; }
  .center { min-height: 80vh; display: flex; flex-direction: column; justify-content: center; }
  .toast { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 20; display: none; max-width: 90%; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const eur = new Intl.NumberFormat("nl-BE", { style: "currency", currency: "EUR" });
const fmt = cents => eur.format(cents / 100);
const toCents = v => Math.round(Number(v) * 100);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Accepts "12,50", "12.50", "1.234,56", "€ 12" → cents, or null if invalid.
function parseEuro(str) {
  let s = String(str || "").replace(/[€\s]/g, "");
  if (!s) return null;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  if (!/^\d+(\.\d{0,2})?$/.test(s)) return null;
  return Math.round(parseFloat(s) * 100);
}
const centsToInput = c => (c / 100).toFixed(2).replace(".", ",");
const today = () => new Date().toLocaleDateString("sv-SE"); // YYYY-MM-DD local

let state = { pin: localStorage.getItem("split.pin") || "", names: { a: "", b: "" }, entries: [] };
const name = p => state.names[p] || (p === "a" ? "Person A" : "Person B");
const other = p => (p === "a" ? "b" : "a");

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = "none"), 2500);
}

async function rpc(fn, args = {}) {
  let res;
  try {
    res = await fetch("api/" + fn, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ p_pin: state.pin, ...args }) });
  } catch { throw new Error("Can't reach the server — is Tailscale on?"); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || "Server error");
  return body.data;
}

async function load() {
  const data = await rpc("split_list");
  state.names = { a: data.settings.name_a, b: data.settings.name_b };
  state.entries = data.entries.map(e => ({ ...e, amount: toCents(e.amount), share_a: toCents(e.share_a), share_b: toCents(e.share_b) }));
}

// Positive = B owes A, negative = A owes B (in cents).
function balance() {
  return state.entries.reduce((sum, e) => sum + (e.paid_by === "a" ? e.share_b : -e.share_a), 0);
}

// ---------- Screens ----------
function renderLogin(err = "") {
  $("#app").innerHTML = `
    <div class="center">
      <h1 style="text-align:center;margin-bottom:8px">Split</h1>
      <p class="muted" style="text-align:center;margin-top:0">Enter your shared PIN.<br>The first time, the PIN you pick becomes the PIN (min. 6 characters).</p>
      <form id="login">
        <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" autofocus>
        <div class="hint err">${esc(err)}</div>
        <button class="primary" style="width:100%;margin-top:8px">Open</button>
      </form>
    </div>`;
  $("#login").onsubmit = async ev => {
    ev.preventDefault();
    state.pin = $("#pin").value;
    try { await load(); localStorage.setItem("split.pin", state.pin); renderHome(); }
    catch (e) { state.pin = ""; renderLogin(e.message); }
  };
}

function describeSplit(e) {
  if (e.split_mode === "settle") return `${esc(name(e.paid_by))} paid ${esc(name(other(e.paid_by)))}`;
  const how = { equal: "split equally", full: `${esc(name(other(e.paid_by)))} owes all`, exact: "custom amounts",
    percent: `${Math.round((e.share_a / e.amount) * 100)}/${100 - Math.round((e.share_a / e.amount) * 100)}` }[e.split_mode];
  return `${esc(name(e.paid_by))} paid ${fmt(e.amount)} · ${how}`;
}

function renderHome() {
  const bal = balance();
  const debtor = bal > 0 ? "b" : "a", creditor = other(debtor);
  const months = {};
  for (const e of state.entries) {
    const key = e.spent_on.slice(0, 7);
    (months[key] ||= []).push(e);
  }
  const list = Object.entries(months).map(([key, items]) => {
    const label = new Date(key + "-01T12:00").toLocaleDateString("en-GB", { month: "long", year: "numeric" });
    return `<div class="month">${label}</div><div class="card" style="padding:4px 12px">${items.map(e => {
      const d = new Date(e.spent_on + "T12:00");
      // Effect on person A's balance
      const eff = e.paid_by === "a" ? e.share_b : -e.share_a;
      const settle = e.split_mode === "settle";
      const lender = eff > 0 ? "a" : "b";
      const effHtml = settle ? `<span class="muted">settled</span><b>${fmt(e.amount)}</b>`
        : eff === 0 ? `<span class="muted">not involved</span>`
        : `<span class="muted">${esc(name(lender))} lent</span><b class="${lender === "a" ? "pos" : "neg"}">${fmt(Math.abs(eff))}</b>`;
      return `<div class="entry" data-id="${e.id}">
        <div class="date">${d.toLocaleDateString("en-GB", { month: "short" })}<b>${d.getDate()}</b></div>
        <div class="main"><div class="desc">${settle ? "💸 " : ""}${esc(e.description)}</div><div class="sub">${describeSplit(e)}</div></div>
        <div class="eff">${effHtml}</div></div>`;
    }).join("")}</div>`;
  }).join("");

  $("#app").innerHTML = `
    <header><h1>Split</h1><button class="ghost" id="settingsBtn" aria-label="Settings">⚙️ Settings</button></header>
    <div class="card balance">
      ${bal === 0
        ? `<div class="who">All settled up</div><div class="amt">${fmt(0)}</div>`
        : `<div class="who">${esc(name(debtor))} owes ${esc(name(creditor))}</div>
           <div class="amt ${debtor === "b" ? "pos" : "neg"}">${fmt(Math.abs(bal))}</div>
           <button class="primary" id="settleBtn">Settle up</button>`}
    </div>
    ${list || `<div class="empty">No expenses yet.<br>Tap “Add expense” to start.</div>`}
    <button class="primary fab" id="addBtn">＋ Add expense</button>`;

  $("#addBtn").onclick = () => openExpense();
  $("#settingsBtn").onclick = openSettings;
  if ($("#settleBtn")) $("#settleBtn").onclick = () => openSettle();
  document.querySelectorAll(".entry").forEach(el => (el.onclick = () => {
    const e = state.entries.find(x => x.id === el.dataset.id);
    e.split_mode === "settle" ? openSettle(e) : openExpense(e);
  }));
}

// ---------- Sheets ----------
function openSheet(html) { $("#sheet").innerHTML = html; $("#overlay").classList.add("open"); }
function closeSheet() { $("#overlay").classList.remove("open"); }
$("#overlay").onclick = ev => { if (ev.target.id === "overlay") closeSheet(); };

async function saveEntry(entry, btn) {
  btn.disabled = true;
  try {
    await rpc("split_save", {
      p_id: entry.id || null, p_spent_on: entry.spent_on, p_description: entry.description,
      p_amount: entry.amount / 100, p_paid_by: entry.paid_by,
      p_share_a: entry.share_a / 100, p_share_b: entry.share_b / 100, p_split_mode: entry.split_mode,
    });
    await load(); closeSheet(); renderHome(); toast("Saved");
  } catch (e) { btn.disabled = false; toast(e.message); }
}

async function deleteEntry(id) {
  if (!confirm("Delete this entry?")) return;
  try { await rpc("split_delete", { p_id: id }); await load(); closeSheet(); renderHome(); toast("Deleted"); }
  catch (e) { toast(e.message); }
}

function openExpense(existing) {
  const f = existing ? { ...existing } : { description: "", amount: 0, spent_on: today(), paid_by: "a", split_mode: "equal", share_a: 0, share_b: 0 };
  // Custom-split inputs (kept as text while typing)
  let exactA = existing && f.split_mode === "exact" ? centsToInput(f.share_a) : "";
  let pctA = existing && f.split_mode === "percent" ? String(Math.round((f.share_a / f.amount) * 100)) : "50";

  openSheet(`
    <h2>${existing ? "Edit expense" : "Add expense"}</h2>
    <label for="desc">What for?</label>
    <input id="desc" placeholder="e.g. Groceries" value="${esc(f.description)}" maxlength="80">
    <div class="row">
      <div><label for="amt">Amount (€)</label><input id="amt" class="big" inputmode="decimal" placeholder="0,00" value="${f.amount ? centsToInput(f.amount) : ""}"></div>
      <div><label for="date">Date</label><input id="date" type="date" value="${f.spent_on}"></div>
    </div>
    <label>Paid by</label>
    <div class="seg" id="paidBy">
      <button type="button" data-v="a">${esc(name("a"))}</button><button type="button" data-v="b">${esc(name("b"))}</button>
    </div>
    <label>Split</label>
    <div class="seg" id="mode">
      <button type="button" data-v="equal">Equally</button>
      <button type="button" data-v="full" id="fullBtn"></button>
      <button type="button" data-v="exact">Amounts</button>
      <button type="button" data-v="percent">Percent</button>
    </div>
    <div id="custom"></div>
    <div class="hint" id="hint"></div>
    <div class="actions">
      ${existing ? `<button type="button" class="danger" id="del">Delete</button>` : `<button type="button" id="cancel">Cancel</button>`}
      <button type="button" class="primary" id="save">Save</button>
    </div>`);

  const amountCents = () => parseEuro($("#amt").value);

  // Computes shares from the current form; returns {share_a, share_b} or an error string.
  function compute() {
    const amt = amountCents();
    if (!amt) return "Enter an amount";
    const payer = f.paid_by, o = other(payer);
    const s = { a: 0, b: 0 };
    if (f.split_mode === "equal") {
      s[o] = Math.floor(amt / 2); s[payer] = amt - s[o];           // odd cent stays with payer
    } else if (f.split_mode === "full") {
      s[o] = amt;
    } else if (f.split_mode === "exact") {
      const a = parseEuro(exactA);
      if (a === null) return `Enter ${name("a")}'s share`;
      if (a > amt) return "Share can't be more than the total";
      s.a = a; s.b = amt - a;
    } else if (f.split_mode === "percent") {
      const p = Number(pctA);
      if (!(p >= 0 && p <= 100) || pctA === "") return "Percent must be 0–100";
      s.a = Math.round((amt * p) / 100); s.b = amt - s.a;
    }
    return { share_a: s.a, share_b: s.b };
  }

  function refresh() {
    document.querySelectorAll("#paidBy button").forEach(b => b.classList.toggle("on", b.dataset.v === f.paid_by));
    document.querySelectorAll("#mode button").forEach(b => b.classList.toggle("on", b.dataset.v === f.split_mode));
    $("#fullBtn").textContent = `${name(other(f.paid_by))} owes all`;
    const r = compute();
    $("#hint").className = "hint" + (typeof r === "string" && amountCents() ? " err" : "");
    $("#hint").textContent = typeof r === "string" ? (amountCents() ? r : "")
      : `${name("a")}: ${fmt(r.share_a)} · ${name("b")}: ${fmt(r.share_b)} → ${name(other(f.paid_by))} owes ${fmt(f.paid_by === "a" ? r.share_b : r.share_a)}`;
  }

  function renderCustom() {
    const c = $("#custom");
    if (f.split_mode === "exact") {
      c.innerHTML = `<label for="exA">${esc(name("a"))}'s share (€) — ${esc(name("b"))} gets the rest</label>
        <input id="exA" inputmode="decimal" placeholder="0,00" value="${esc(exactA)}">`;
      $("#exA").oninput = ev => { exactA = ev.target.value; refresh(); };
    } else if (f.split_mode === "percent") {
      c.innerHTML = `<label for="pcA">${esc(name("a"))}'s share (%) — ${esc(name("b"))} gets the rest</label>
        <input id="pcA" inputmode="numeric" value="${esc(pctA)}">`;
      $("#pcA").oninput = ev => { pctA = ev.target.value; refresh(); };
    } else c.innerHTML = "";
  }

  document.querySelectorAll("#paidBy button").forEach(b => (b.onclick = () => { f.paid_by = b.dataset.v; refresh(); }));
  document.querySelectorAll("#mode button").forEach(b => (b.onclick = () => { f.split_mode = b.dataset.v; renderCustom(); refresh(); }));
  $("#amt").oninput = refresh;
  renderCustom(); refresh();
  if (!existing) $("#desc").focus();

  if ($("#cancel")) $("#cancel").onclick = closeSheet;
  if ($("#del")) $("#del").onclick = () => deleteEntry(existing.id);
  $("#save").onclick = ev => {
    const r = compute();
    const description = $("#desc").value.trim();
    if (!description) return toast("Add a description");
    if (typeof r === "string") return toast(r);
    if (!$("#date").value) return toast("Pick a date");
    saveEntry({ ...f, description, amount: amountCents(), spent_on: $("#date").value, ...r }, ev.target);
  };
}

function openSettle(existing) {
  const bal = balance();
  // Default: debtor pays creditor the full outstanding balance.
  let payer = existing ? existing.paid_by : (bal > 0 ? "b" : "a");
  openSheet(`
    <h2>${existing ? "Edit payment" : "Settle up"}</h2>
    <label>Who paid?</label>
    <div class="seg" id="payer">
      <button type="button" data-v="a"></button><button type="button" data-v="b"></button>
    </div>
    <div class="row">
      <div><label for="samt">Amount (€)</label><input id="samt" class="big" inputmode="decimal" value="${centsToInput(existing ? existing.amount : Math.abs(bal))}"></div>
      <div><label for="sdate">Date</label><input id="sdate" type="date" value="${existing ? existing.spent_on : today()}"></div>
    </div>
    <div class="hint">You can pay back part of it — change the amount.</div>
    <div class="actions">
      ${existing ? `<button type="button" class="danger" id="del">Delete</button>` : `<button type="button" id="cancel">Cancel</button>`}
      <button type="button" class="primary" id="save">Record payment</button>
    </div>`);
  const refresh = () => document.querySelectorAll("#payer button").forEach(b => {
    b.classList.toggle("on", b.dataset.v === payer);
    b.textContent = `${name(b.dataset.v)} → ${name(other(b.dataset.v))}`;
  });
  document.querySelectorAll("#payer button").forEach(b => (b.onclick = () => { payer = b.dataset.v; refresh(); }));
  refresh();
  if ($("#cancel")) $("#cancel").onclick = closeSheet;
  if ($("#del")) $("#del").onclick = () => deleteEntry(existing.id);
  $("#save").onclick = ev => {
    const amt = parseEuro($("#samt").value);
    if (!amt) return toast("Enter an amount");
    const receiver = other(payer);
    // The receiver "consumed" the payment, so it moves the balance toward zero.
    saveEntry({ id: existing?.id, description: "Payment", amount: amt, spent_on: $("#sdate").value || today(), paid_by: payer,
      share_a: receiver === "a" ? amt : 0, share_b: receiver === "b" ? amt : 0, split_mode: "settle" }, ev.target);
  };
}

function openSettings() {
  openSheet(`
    <h2>Settings</h2>
    <label for="na">Name 1</label><input id="na" value="${esc(state.names.a)}" maxlength="20">
    <label for="nb">Name 2</label><input id="nb" value="${esc(state.names.b)}" maxlength="20">
    <label for="np">New PIN (leave empty to keep the current one)</label>
    <input id="np" type="password" inputmode="numeric" autocomplete="new-password" placeholder="min. 6 characters">
    <div class="actions">
      <button type="button" id="logout">Log out</button>
      <button type="button" class="primary" id="save">Save</button>
    </div>`);
  $("#logout").onclick = () => { localStorage.removeItem("split.pin"); state.pin = ""; closeSheet(); renderLogin(); };
  $("#save").onclick = async ev => {
    const a = $("#na").value.trim(), b = $("#nb").value.trim(), np = $("#np").value;
    if (!a || !b) return toast("Both names are needed");
    if (np && np.length < 6) return toast("PIN must be at least 6 characters");
    ev.target.disabled = true;
    try {
      await rpc("split_settings_save", { p_name_a: a, p_name_b: b, p_new_pin: np || null });
      if (np) { state.pin = np; localStorage.setItem("split.pin", np); }
      await load(); closeSheet(); renderHome(); toast("Saved");
    } catch (e) { ev.target.disabled = false; toast(e.message); }
  };
}

// Refresh when coming back to the app, so you see the other person's changes.
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && state.pin && !$("#overlay").classList.contains("open")) {
    try { await load(); renderHome(); } catch {}
  }
});

(async () => {
  if (!state.pin) return renderLogin();
  try { await load(); renderHome(); }
  catch (e) {
    if (e.message !== "Wrong PIN") { $("#app").innerHTML = `<div class="center empty">${esc(e.message)}<br><br><button class="primary" onclick="location.reload()">Try again</button></div>`; return; }
    localStorage.removeItem("split.pin"); state.pin = ""; renderLogin(e.message);
  }
})();
</script>
</body>
</html>
